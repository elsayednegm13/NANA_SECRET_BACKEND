<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NANA SECRET dashboard login">
  <title>NANA SECRET | تسجيل دخول لوحة التحكم</title>
  <link rel="icon" href="assets/images/logo.webp" type="image/webp">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="dashboard-body dashboard-login-page" data-page="dashboard-login">
  <main class="dashboard-shell login-only" id="main">
    <section class="dashboard-login" data-login-box>
      <form class="dashboard-login-card" data-login-form>
        <img src="assets/images/logo.webp" alt="NANA SECRET logo">
        <h1>تسجيل دخول لوحة التحكم</h1>
        <p>بعد تسجيل الدخول سيتم نقلك إلى لوحة التحكم مباشرة.</p>
        <label>اسم المستخدم<input id="admin-username" autocomplete="username" required></label>
        <label>كلمة المرور<input id="admin-password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">تسجيل الدخول</button>
        <div class="dashboard-message" data-dashboard-message></div>
      </form>
    </section>
  </main>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
